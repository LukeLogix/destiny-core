name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 本 repo 是 public，CI 一律跑 GitHub 託管的 runner。
    #
    # 2026-10-07 以前，push 到 main 會改用自架 runner（由 repo variable CI_RUNNER
    # 決定），pull_request 才走託管。那樣的隔離只寫在這個檔裡，而 pull_request
    # 觸發時用的是 PR 自己帶的 workflow 檔——PR 可以把 runs-on 改掉。public repo
    # 不該掛著自架 runner，所以整個移除：runner 已取消註冊、CI_RUNNER 已刪除，
    # 這裡不再讀它。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 格式檢查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下檔案未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 單元測試
        run: go test -v ./...

      # 第五條硬規則：主 module 不得引入外部依賴。
      # 靠檢查，不靠自律。
      - name: 零依賴檢查
        run: |
          set -euo pipefail

          # -test 一併納入測試檔的 import。少了它，主 module 的 _test.go
          # 引入外部套件會讓 go.mod 長出 require，而檢查照樣印綠燈——
          # 那正是這條規則要擋的東西。
          #
          # 不加 || true：go list 若失敗（模組快取損毀、GOFLAGS 設定錯誤等）
          # 必須讓整個步驟失敗，而非拿空字串當作「沒有外部依賴」。
          deps=$(go list -deps -test ./...)

          # 判定「外部」看第一段是否為網域樣式，不能只看有沒有點——
          # 標準庫自身的 vendored 套件會以 vendor/golang.org/x/... 出現，
          # 只要有套件引用 net/http 就會被誤判成外部依賴而擋下每一個 PR。
          ext=$(printf '%s\n' "$deps" \
            | grep -E '^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/' \
            | grep -v '^github.com/LukeLogix/destiny-core' \
            || true)

          if [ -n "$ext" ]; then
            echo "主 module 出現外部依賴："
            echo "$ext"
            exit 1
          fi
          echo "✅ 零外部依賴（已含測試檔的 import）"

      - name: 交叉驗證（獨立 module）
        run: cd test && go test ./...
