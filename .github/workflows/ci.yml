name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 由 repo variable CI_RUNNER 決定跑在哪，與 msgmesh-platform 同一慣例；
    # 未設定時退回 ubuntu-latest，方便 fork 的人不必先架 runner。
    # 目前值：["self-hosted","pve-ci"] → PVE CT109 上的 pve-ci-destiny。
    #
    # 標籤要寫到 pve-ci 而非只寫 self-hosted：CT106 也有一台帶 self-hosted 的 runner。
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      # pve-ci 沒有系統層級的 Go，靠這步取得；首次執行後會留在 runner 的
      # tool cache（_work/_tool/go/），之後近乎零成本。與 msgmesh-platform 一致。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 格式檢查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下檔案未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 單元測試
        run: go test -v ./...

      # 第五條硬規則：主 module 不得引入外部依賴。
      # 靠檢查，不靠自律。
      - name: 零依賴檢查
        run: |
          set -euo pipefail

          # -test 一併納入測試檔的 import。少了它，主 module 的 _test.go
          # 引入外部套件會讓 go.mod 長出 require，而檢查照樣印綠燈——
          # 那正是這條規則要擋的東西。
          #
          # 不加 || true：go list 若失敗（模組快取損毀、GOFLAGS 設定錯誤等）
          # 必須讓整個步驟失敗，而非拿空字串當作「沒有外部依賴」。
          deps=$(go list -deps -test ./...)

          # 判定「外部」看第一段是否為網域樣式，不能只看有沒有點——
          # 標準庫自身的 vendored 套件會以 vendor/golang.org/x/... 出現，
          # 只要有套件引用 net/http 就會被誤判成外部依賴而擋下每一個 PR。
          ext=$(printf '%s\n' "$deps" \
            | grep -E '^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/' \
            | grep -v '^github.com/LukeLogix/destiny-core' \
            || true)

          if [ -n "$ext" ]; then
            echo "主 module 出現外部依賴："
            echo "$ext"
            exit 1
          fi
          echo "✅ 零外部依賴（已含測試檔的 import）"

      - name: 交叉驗證（獨立 module）
        run: cd test && go test ./...
