name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 跑在自架 runner 上。若日後要限定特定機器，把 self-hosted 換成
    # 陣列形式並補上該 runner 的標籤，例如：
    #   runs-on: [self-hosted, linux, x64, destiny]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # 自架 runner 若已預裝 Go 1.25 以上，這一步可整段移除以省下每次的安裝時間；
      # 保留的好處是版本由 workflow 決定，不隨機器上的 Go 版本漂移。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 格式檢查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下檔案未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 單元測試
        run: go test -v ./...

      # 第五條硬規則：主 module 不得引入外部依賴。
      # 靠檢查，不靠自律。
      - name: 零依賴檢查
        run: |
          set -euo pipefail

          # -test 一併納入測試檔的 import。少了它，主 module 的 _test.go
          # 引入外部套件會讓 go.mod 長出 require，而檢查照樣印綠燈——
          # 那正是這條規則要擋的東西。
          #
          # 不加 || true：go list 若失敗（模組快取損毀、GOFLAGS 設定錯誤等）
          # 必須讓整個步驟失敗，而非拿空字串當作「沒有外部依賴」。
          deps=$(go list -deps -test ./...)

          # 判定「外部」看第一段是否為網域樣式，不能只看有沒有點——
          # 標準庫自身的 vendored 套件會以 vendor/golang.org/x/... 出現，
          # 只要有套件引用 net/http 就會被誤判成外部依賴而擋下每一個 PR。
          ext=$(printf '%s\n' "$deps" \
            | grep -E '^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/' \
            | grep -v '^github.com/LukeLogix/destiny-core' \
            || true)

          if [ -n "$ext" ]; then
            echo "主 module 出現外部依賴："
            echo "$ext"
            exit 1
          fi
          echo "✅ 零外部依賴（已含測試檔的 import）"

      - name: 交叉驗證（獨立 module）
        run: cd test && go test ./...
