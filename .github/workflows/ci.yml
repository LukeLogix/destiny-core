name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ⚠️ 本 repo 是 public，pull_request 一律走 GitHub 託管 runner。
    #
    # self-hosted runner 位於家用內網，而 public repo 的 fork PR 等同讓任意人
    # 在該機器上執行程式碼——同一台 pve-ci 還放著其他 repo 的工作目錄。
    # public repo 無法設定 fork PR 的核准政策（API 回 422），故只能從 runs-on 隔離。
    #
    # push 到 main 才用自架 runner，由 repo variable CI_RUNNER 決定（同 msgmesh-platform 慣例），
    # 未設定時退回 ubuntu-latest。目前值：["self-hosted","pve-ci"] → CT109 的 pve-ci-destiny。
    runs-on: ${{ github.event_name == 'push' && fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      # CI_RUNNER 是 repo variable，不在 git 裡——repo 重建或誤刪時
      # runs-on 會靜靜回落到 ubuntu-latest，CI 照樣全綠、額度繼續燒。
      # 這一步讓那種漂移變成紅燈而不是無聲。
      #
      # 刻意只比對前綴、不印出任何主機或網路資訊：本 repo 是 public，
      # Actions 日誌任何人可讀，workflow 裡絕不可出現 env / hostname -I /
      # ip addr / docker info 這類會把內網位址寫進公開日誌的指令。
      - name: 確認跑在預期的 runner 上
        if: github.event_name == 'push'
        run: |
          case "$RUNNER_NAME" in
            pve-ci*) echo "✅ 自架 runner" ;;
            *) echo "❌ 預期自架 runner，實際並非——CI_RUNNER variable 可能已遺失"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      # pve-ci 沒有系統層級的 Go，靠這步取得；首次執行後會留在 runner 的
      # tool cache（_work/_tool/go/），之後近乎零成本。與 msgmesh-platform 一致。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 格式檢查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下檔案未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 單元測試
        run: go test -v ./...

      # 第五條硬規則：主 module 不得引入外部依賴。
      # 靠檢查，不靠自律。
      - name: 零依賴檢查
        run: |
          set -euo pipefail

          # -test 一併納入測試檔的 import。少了它，主 module 的 _test.go
          # 引入外部套件會讓 go.mod 長出 require，而檢查照樣印綠燈——
          # 那正是這條規則要擋的東西。
          #
          # 不加 || true：go list 若失敗（模組快取損毀、GOFLAGS 設定錯誤等）
          # 必須讓整個步驟失敗，而非拿空字串當作「沒有外部依賴」。
          deps=$(go list -deps -test ./...)

          # 判定「外部」看第一段是否為網域樣式，不能只看有沒有點——
          # 標準庫自身的 vendored 套件會以 vendor/golang.org/x/... 出現，
          # 只要有套件引用 net/http 就會被誤判成外部依賴而擋下每一個 PR。
          ext=$(printf '%s\n' "$deps" \
            | grep -E '^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/' \
            | grep -v '^github.com/LukeLogix/destiny-core' \
            || true)

          if [ -n "$ext" ]; then
            echo "主 module 出現外部依賴："
            echo "$ext"
            exit 1
          fi
          echo "✅ 零外部依賴（已含測試檔的 import）"

      - name: 交叉驗證（獨立 module）
        run: cd test && go test ./...
